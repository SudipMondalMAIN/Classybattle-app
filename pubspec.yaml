name: classybattle_app
description: "ClassyBattle - eSports Tournament Platform"
publish_to: 'none'

version: 2.3.3+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  dio: ^5.7.0
  web_socket_channel: ^3.0.1

  flutter_riverpod: ^2.6.1
  connectivity_plus: ^6.1.0

  flutter_secure_storage: ^9.2.2

  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

  intl: ^0.20.2

  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  video_player: ^2.9.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  font_awesome_flutter: ^10.7.0
  package_info_plus: ^8.1.2
  cloudflare_turnstile: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/splash_scene.png
    - assets/images/cb_logo.png
    - assets/avatars/avatar_1.png
    - assets/avatars/avatar_2.png
    - assets/avatars/avatar_3.png
    - assets/avatars/avatar_4.png
    - assets/avatars/avatar_5.png
    - assets/avatars/avatar_6.png
    - assets/banners/free_tournaments_banner.jpg
    - assets/banners/solo_tournaments_banner.jpg
    - assets/banners/duo_tournaments_banner.jpg
    - assets/banners/squad_tournaments_banner.jpg
    - assets/banners/cs_1v1_banner.jpg
    - assets/banners/cs_head_banner.jpg
    - assets/banners/cs_4v4_banner.jpg
    - assets/banners/lw_1v1_banner.jpg
    - assets/banners/lw_head_banner.jpg
    - assets/banners/br_survive_banner.jpg
    - assets/banners/refer_earn_banner.jpg